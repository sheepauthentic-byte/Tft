name: Build Sheepct TFTMod iOS Dylib

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode & iOS SDK on runner
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install ldid

      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"

      - name: Build tftmod.dylib with Theos
        env:
          THEOS: /Users/runner/theos
        run: |
          make all FINALPACKAGE=1
          mkdir -p dist
          DYLIB_PATH=$(find .theos -name "tftmod.dylib" | head -n 1)
          echo "Found dylib: $DYLIB_PATH"
          test -n "$DYLIB_PATH"
          cp "$DYLIB_PATH" dist/tftmod.dylib
          strip -x dist/tftmod.dylib || true
          ldid -S dist/tftmod.dylib
          ls -lh dist/tftmod.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheepct-tftmod-dylib-arm64
          path: dist/tftmod.dylib
