name: Build Sheepct TFTMod Final iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos & Procursus ldid
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          brew install ldid xz
          mkdir -p ~/theos/sdks
          curl -sL https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz | tar -xJ -C ~/theos/sdks

      - name: Build dylib (make all)
        env:
          THEOS: /Users/runner/theos
        run: |
          make all FINALPACKAGE=1
          mkdir -p dist
          cp .theos/obj/tftmod.dylib dist/tftmod.dylib
          strip -x dist/tftmod.dylib
          ldid -S dist/tftmod.dylib

      - name: Upload tftmod.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheepct-tftmod-final-arm64
          path: dist/tftmod.dylib
